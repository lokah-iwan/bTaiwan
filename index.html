<!DOCTYPE html>
<html class="staticrypt-html" lang="zh-Hant">
    <head>
        <meta charset="utf-8" />
        <title>東半島三人行</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Nunito:wght@500;700&display=swap">
        <style>
            /* Same palette and type as the trip page (src/index.html) */
            :root{--bg:#f3f5f4;--surface:#fff;--ink:#16232b;--muted:#5b6b72;--line:#d6dedd;--accent:#0e6a78;--accent-ink:#fff;--warn:#a35a00;--warn-bg:#fff3e0;
              --font:"Huninn","PingFang TC","Microsoft JhengHei",sans-serif;--font-num:"Nunito","Huninn",system-ui,sans-serif}
            @media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1719;--surface:#172226;--ink:#e3eceb;--muted:#93a5a8;--line:#2a393d;--accent:#3fb3c2;--accent-ink:#06262b;--warn:#f0b35a;--warn-bg:#33240f}}
            *{box-sizing:border-box}
            .staticrypt-html{height:100%}
            .staticrypt-body{min-height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
            .staticrypt-content{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
            .staticrypt-page{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
            .staticrypt-head h1{font-size:28px;font-weight:400;margin:0;line-height:1.2}
            .staticrypt-head p{margin:4px 0 0;font-size:13px;color:var(--muted)}
            .staticrypt-head .num{font-family:var(--font-num)}
            .staticrypt-form{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
            .staticrypt-form label.lbl{font-size:13px;opacity:.85}
            .staticrypt-password-container{position:relative}
            .staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{width:100%;min-height:52px;border:0;border-radius:12px;padding:0 52px 0 16px;font:18px var(--font);background:var(--surface);color:var(--ink);outline:0}
            .staticrypt-form input:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-ink) 60%,transparent)}
            .staticrypt-toggle-password-visibility{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;padding:10px;cursor:pointer;opacity:.55}
            @media (prefers-color-scheme:dark){.staticrypt-toggle-password-visibility{filter:invert(1)}}
            label.staticrypt-remember{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
            .staticrypt-remember input[type="checkbox"]{width:20px;height:20px;margin:0;accent-color:var(--accent-ink)}
            .staticrypt-decrypt-button{min-height:52px;border:0;border-radius:12px;background:var(--accent-ink);color:var(--accent);font:700 17px var(--font);cursor:pointer}
            .staticrypt-decrypt-button:active{filter:brightness(.95)}
            .staticrypt-error{margin:0;font-size:14px;font-weight:700;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px}
            .hidden{display:none!important}
            .staticrypt-spinner-container{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
            .staticrypt-spinner{width:2rem;height:2rem;border:.25em solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spinner-border .75s linear infinite}
            @keyframes spinner-border{100%{transform:rotate(360deg)}}
        </style>
    </head>
